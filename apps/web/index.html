<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlameAtlas</title>
    <!-- Theme before first paint (no flash). Reads saved choice from localStorage or prefers-color-scheme -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem("flameatlas-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          try { t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; } catch (e) { t = "dark"; }
        }
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <style>
      html { background: #090c13; }
      html[data-theme="light"] { background: #f6f5f1; }
    </style>
    <meta name="theme-color" content="#090c13" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Explore NASA combustion experiments, see which results can fairly be compared, and find where the evidence ends." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
