name = "flameatlas-api"
main = "src/index.ts"
compatibility_date = "2024-11-06"

[dev]
port = 8787

[vars]
DATA_VERSION = "fixture-0.1"
# Tried in order: one request per model, next one only on 404/429/503 or timeout.
GEMINI_MODELS = "gemini-3.8-flash,gemini-3.5-flash,gemini-3.1-flash-lite"

# Workers AI: query embeddings with @cf/baai/bge-small-en-v1.5
[ai]
binding = "AI"

# Answer cache keyed by (prompt, data version). Create with:
#   npx wrangler kv namespace create ANSWERS
# then paste the id below.
# [[kv_namespaces]]
# binding = "ANSWERS"
# id = "<paste id>"

# Gemini key: npx wrangler secret put GEMINI_API_KEY   (local dev: GEMINI_API_KEY=... in .dev.vars)
